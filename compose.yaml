# Local Neo4j Community for development and the live demo. Aura users skip this file.
# Credentials come from the root .env (NEO4J_PASSWORD); ports bind to loopback only.
services:
  neo4j:
    image: neo4j:5.26.16-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - entropy-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  entropy-neo4j-data:
