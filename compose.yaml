services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: entropy-neo4j
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    environment:
      NEO4J_AUTH: '${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}'
    volumes:
      - entropy-neo4j:/data

volumes:
  entropy-neo4j:
